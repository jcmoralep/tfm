# Local MySQL for development. Credentials come from environment variables or a local .env file
# (gitignored; variables are listed in README.md). The image version must match the configuration key Database:MySqlServerVersion
# (env var Database__MySqlServerVersion; default in MySqlDatabase.DefaultServerVersion).
services:
  mysql:
    image: mysql:8.4
    container_name: bmadplatform-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bmadplatform
      MYSQL_USER: ${MYSQL_USER:-bmad}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD (see README.md)}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD (see README.md)}
    ports:
      # Host port defaults to 3307 so it does not clash with another MySQL already bound to 3306.
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
